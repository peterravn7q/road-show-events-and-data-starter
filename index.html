    4. Inde i div.bg: tre <img>-elementer. Husk src, id, class og en god alt-tekst:
         src="img/red-car.png"         id="redCar"     class="car1"
         src="img/car.gif"             id="policeCar"  class="car2"
         src="img/light-blue-car.png"  id="blueCar"    class="car3"

    5. Efter section.scene, men stadig inde i <main>:
         et <div> med id="tooltip" og class="tooltip".
         Husk fra ARIA-øvelsen: giv den også aria-live="polite",
         så skærmlæsere læser teksten op, når den skifter.
